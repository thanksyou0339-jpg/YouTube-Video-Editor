<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Islamic Video Maker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>🕌 Islamic Video Maker</h1>
            <p>Hadith اور Islamic Content سے ویڈیو بنائیں</p>
        </header>


        <section class="card">

            <label for="hadith">
                📖 عربی حدیث
            </label>

            <textarea
                id="hadith"
                placeholder="یہاں عربی حدیث لکھیں..."
            ></textarea>


            <label for="translation">
                🌙 اردو ترجمہ
            </label>

            <textarea
                id="translation"
                placeholder="یہاں حدیث کا اردو ترجمہ لکھیں..."
            ></textarea>


            <label for="explanation">
                📝 وضاحت
            </label>

            <textarea
                id="explanation"
                placeholder="یہاں حدیث کی مختصر وضاحت لکھیں..."
            ></textarea>


            <label for="voice">
                🎙️ آواز منتخب کریں
            </label>

            <select id="voice">

                <option value="ur-PK-UzmaNeural">
                    اردو — خواتین کی آواز
                </option>

                <option value="ur-PK-AsadNeural">
                    اردو — مردانہ آواز
                </option>

                <option value="ar-SA-ZariyahNeural">
                    عربی — خواتین کی آواز
                </option>

                <option value="ar-SA-HamedNeural">
                    عربی — مردانہ آواز
                </option>

            </select>


            <label for="background">
                🖼️ Background Image URL
            </label>

            <input
                type="text"
                id="background"
                placeholder="اختیاری — تصویر کا URL یہاں ڈالیں"
            >


            <button
                id="generateBtn"
                class="generate-btn"
                onclick="generateVideo()"
            >
                🎬 ویڈیو بنائیں
            </button>


            <div id="status" class="status"></div>

        </section>


        <section
            id="resultSection"
            class="card result-card"
            style="display:none;"
        >

            <h2>🎥 آپ کی ویڈیو تیار ہے</h2>

            <video
                id="videoPreview"
                controls
                playsinline
            ></video>


            <div class="buttons">

                <a
                    id="downloadBtn"
                    class="download-btn"
                    href="#"
                    download
                >
                    ⬇️ MP4 Download کریں
                </a>


                <button
                    class="record-btn"
                    onclick="startRecording()"
                >
                    🔴 Screen Recording شروع کریں
                </button>


                <button
                    class="stop-btn"
                    onclick="stopRecording()"
                >
                    ⏹️ Recording بند کریں
                </button>

            </div>


            <p id="recordingStatus"></p>

        </section>


        <footer>

            <p>
                Islamic Video Maker — Original Educational Content
            </p>

        </footer>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
